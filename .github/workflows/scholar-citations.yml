name: Update Scholar citations

on:
  schedule:
    # Daily at 09:17 UTC. Off the hour on purpose: GitHub's scheduler is
    # busiest on the hour and delays those runs the most.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scholarly
        run: pip install --quiet scholarly

      - name: Fetch citation count
        run: python scripts/fetch_citations.py

      - name: Commit if the count changed
        run: |
          if [[ -n "$(git status --porcelain citations.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add citations.json
            git commit -m "Update Google Scholar citation count"
            git push
          else
            echo "Count unchanged, nothing to commit."
          fi
